[project]
name = "intro-to-agentic-ai"
version = "0.1.0"
description = "Repo of Agentic AI use cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "crewai>=0.95.0",
    "fastmcp>=3.4.7",
    "langchain>=1.3.15",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "litellm>=1.97.0",
    "openai>=2.54.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
intro-to-agentic-ai = "intro_to_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]


# ── Pytest
[tool.pytest.ini_options]
#  "src" is importable because the project root (".") is on sys.path
pythonpath = ["."]

#  Only collect tests from the tests/ directory
testpaths = ["tests"]

#  Do NOT auto-collect classes that merely start with "Test"
#  (fixes the TestCase / TestCaseList / TestGenerationState warnings)
python_classes = []

#  Keep the default function-prefix
python_functions = ["test_*"]
